# Скопируй в config.toml и поменяй что нужно. Все параметры необязательные.

[device]
# Путь к adb; "adb" = искать в PATH и в папке platform-tools рядом с программой
adb = "adb"
# Серийный номер из `adb devices`; пусто = единственный подключённый телефон
serial = ""
# Пакет игры для выхода при поражении; пусто = определить автоматически
package = ""
# Как снимать экран: "png" (по кабелю/Wi-Fi) или "raw" (бот работает на самом телефоне)
capture = "png"

[campaign]
# Сколько забегов (по 5 боёв) пройти; 0 = пока не кончится стамина
max_runs = 0
# Пауза между скриншотами, с
poll_interval = 1.0
# Включать «АВТО», если он выключен
manage_auto = true
# Сколько секунд экран итогов без «ПОБЕДА» считать поражением
defeat_confirm = 8.0
# При поражении закрыть игру
exit_game_on_defeat = true
# При непонятной ошибке (неизвестный экран и т.п.) закрыть игру
exit_game_on_error = false
# Куда нажимать, чтобы закрыть баннер «Повышение глубины кампании»:
# доли ширины и высоты экрана (0.5 = середина, 0.85 = низ экрана)
depth_up_tap_x = 0.5
depth_up_tap_y = 0.85
# Сохранять кадр при каждой смене экрана (для отладки и новых шаблонов)
save_frames = false
