name: 💡 Предложить идею / Suggest an idea
description: Идея новой возможности или улучшения / A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Предложение / Proposal
      description: Что хотелось бы добавить или изменить? / What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно / Why
      description: Какую задачу это решает? / What problem does it solve?
    validations:
      required: false
