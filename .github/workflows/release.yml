name: Релиз

# Выпуск: поменять версию в pyproject.toml и btc_bot/__init__.py, затем
#   git tag v0.2.0 && git push origin v0.2.0
# Ручной запуск (без тега) только собирает архив и прикладывает его к запуску.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('btc_bot/__init__.py', encoding='utf-8').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $version, __init__: $code, тег: $tag"
          test "$version" = "$tag" && test "$code" = "$tag"

      - run: uv sync --group build
      - run: uv run pytest -q
      - run: uv run pyinstaller packaging/btc-bot.spec --noconfirm

      - name: Проверка собранной программы
        shell: pwsh
        run: |
          $p = Start-Process dist/BtcAssistant/BtcAssistant.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test завершился с кодом $($p.ExitCode)" }

      - name: Архив
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          Copy-Item config.example.toml dist/BtcAssistant/
          Compress-Archive -Path dist/BtcAssistant -DestinationPath "BtcAssistant-$name-windows.zip"
          "ARCHIVE=BtcAssistant-$name-windows.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
