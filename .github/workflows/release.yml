name: Релиз

# Выпуск: поменять версию в pyproject.toml и btc_bot/__init__.py, дописать раздел
# в CHANGELOG.md и CHANGELOG.en.md (из них собирается текст релиза), затем
#   git tag v0.3.0 && git push origin v0.3.0
# Ручной запуск (без тега) только собирает архивы и прикладывает их к запуску.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 22.04, а не latest: сборка со старой glibc запускается на большем числе дистрибутивов
          - os: ubuntu-22.04
            platform: linux-x86_64
          # Apple Silicon; на Intel-маках запуск из исходников
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Библиотеки для Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1

      - run: uv sync --group build
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run pyinstaller packaging/btc-bot.spec --noconfirm

      - name: Проверка собранной программы
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "${{ runner.os }}" in
            Windows) exe=dist/BtcAssistant/BtcAssistant.exe ;;
            macOS)   exe=dist/BtcAssistant.app/Contents/MacOS/BtcAssistant ;;
            *)       exe=dist/BtcAssistant/BtcAssistant ;;
          esac
          if [ "${{ runner.os }}" = Windows ]; then
            # У exe без консоли код возврата виден только через Start-Process
            pwsh -Command "\$p = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru; exit \$p.ExitCode"
          else
            "$exe" --self-test
          fi

      - name: Архив
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="$GITHUB_REF_NAME"; else name="dev-${GITHUB_SHA::7}"; fi
          archive="BtcAssistant-$name-${{ matrix.platform }}"
          cp config.example.toml dist/BtcAssistant/
          case "${{ runner.os }}" in
            Windows) archive="$archive.zip"
                     pwsh -Command "Compress-Archive -Path dist/BtcAssistant -DestinationPath $archive" ;;
            macOS)   archive="$archive.zip"
                     ditto -c -k --keepParent dist/BtcAssistant.app "$archive" ;;
            *)       archive="$archive.tar.gz"
                     tar czf "$archive" -C dist BtcAssistant ;;
          esac
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия совпадает с тегом
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('btc_bot/__init__.py', encoding='utf-8').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $version, __init__: $code, тег: $tag"
          test "$version" = "$tag" && test "$code" = "$tag"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Текст релиза (что нового + описание + возможности, EN → RU)
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
