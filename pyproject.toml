[project]
name = "tk-btc-assistant"
version = "0.1.0"
description = "Помощник для Tokyo Ghoul: Break the Chains: автопрохождение цепной кампании"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # headless: окна OpenCV не нужны, а обычная сборка на Linux требует libGL
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.scripts]
btc-bot = "btc_bot.cli:main"

[project.gui-scripts]
btc-bot-gui = "btc_bot.gui:main"

[dependency-groups]
# pillow нужен для проверки запасного режима без OpenCV (как в Termux)
dev = ["pytest>=8", "pillow>=10"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btc_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
